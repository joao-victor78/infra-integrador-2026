# Ambiente de desenvolvimento do Financeiro, isolado: PostgreSQL 16 e RabbitMQ.
#   docker compose up -d    → bancos erp e erp_test (usuário financeiro/financeiro) e broker guest/guest
#
# Para rodar junto com a plataforma, use o docker-compose do infra-integrador-2026
# (perfil "modulos", serviço "financeiro" na porta 8085 e "financeiro-front" na 3005).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: financeiro
      POSTGRES_DB: erp
    ports: ["5432:5432"]
    volumes:
      - ./scripts/criar-banco-teste.sql:/docker-entrypoint-initdb.d/01-teste.sql:ro
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]

  # Stub do CRM gerado do contrato (Contrato §14.2), para a busca de contatos da régua.
  crm:
    image: stoplight/prism:5
    profiles: [stubs]
    command: mock -m false -h 0.0.0.0 -p 8082 /specs/crm.yaml
    ports: ["8082:8082"]
    volumes: ["../infra-integrador-2026/contratos/crm.yaml:/specs/crm.yaml:ro"]

volumes:
  pgdata:
