# Testes em todo push e pull request; imagens publicadas a cada push na main (Contrato §14.3).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financeiro" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes (nenhum outro módulo no ar; RabbitMQ e CRM simulados)
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/erp_test
        run: mvn -B verify

  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run build

  publicar-api:
    if: github.event_name == 'push'
    needs: [api]
    permissions:
      contents: read
      packages: write
    uses: karolAlbuquerque/infra-integrador-2026/.github/workflows/publicar-imagem.yml@main
    with:
      imagem: financeiro
      contexto: .

  publicar-front:
    if: github.event_name == 'push'
    needs: [front]
    permissions:
      contents: read
      packages: write
    uses: karolAlbuquerque/infra-integrador-2026/.github/workflows/publicar-imagem.yml@main
    with:
      imagem: financeiro-front
      contexto: frontend
