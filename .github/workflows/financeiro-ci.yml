# Módulo Financeiro (pasta financeiro/): testes em todo push e pull request que mexa nele;
# imagens publicadas a cada push na main (Contrato §14.3).
name: Financeiro

on:
  push:
    branches: [main]
    paths:
      - 'financeiro/**'
      - '.github/workflows/financeiro-ci.yml'
  pull_request:
    paths:
      - 'financeiro/**'
      - '.github/workflows/financeiro-ci.yml'

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeiro
          POSTGRES_PASSWORD: financeiro
          POSTGRES_DB: erp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financeiro" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: financeiro
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: financeiro/pom.xml
      - name: Testes (nenhum outro módulo no ar; RabbitMQ e CRM simulados)
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/erp_test
        run: mvn -B verify

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: financeiro/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: financeiro/frontend/package-lock.json
      - run: |
          npm ci
          npm run typecheck
          npm run build

  publicar-api:
    if: github.event_name == 'push'
    needs: [api]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publicar-imagem.yml
    with:
      imagem: financeiro
      contexto: financeiro

  publicar-front:
    if: github.event_name == 'push'
    needs: [front]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publicar-imagem.yml
    with:
      imagem: financeiro-front
      contexto: financeiro/frontend
